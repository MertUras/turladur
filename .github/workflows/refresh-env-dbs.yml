# Neon develop: migrate + idempotent seed (manual or scheduled).
# Staging Neon branch removed (Free tier — single prod branch on Railway).
#
# Secrets (Direct connection URL — not pooler):
#   DEV_DATABASE_URL → Neon branch `develop` (must NOT be production host — see docs/CYBERPARK_PLAN.md §0)
#
# DAILY CRON: disabled 2026-09-01 — Neon Free compute limit. Re-enable after Launch (§0.3).
# Manual: Actions → Refresh Env DBs → Run workflow (workflow_dispatch).

name: Refresh Env DBs

on:
  # --- Daily auto seed (OFF until Neon Launch — uncomment to restore) ---
  # schedule:
  #   # Dev: every day 03:00 UTC (06:00 TR)
  #   - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Which Neon branch to refresh
        required: true
        type: choice
        options:
          - develop
        default: develop

concurrency:
  group: refresh-env-dbs
  cancel-in-progress: false

jobs:
  refresh-develop:
    name: Refresh Neon develop
    if: >
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.target == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require DEV_DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DEV_DATABASE_URL secret eksik (Neon develop Direct URL)."
            exit 1
          fi

      - name: Migrate + seed (develop)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed
